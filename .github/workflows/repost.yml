name: Репост из wilder_wins

on:
  schedule:
    # каждые 15 минут. GitHub часто запускает с опозданием 5-15 минут — это нормально.
    # хочешь чаще — поставь "*/5 * * * *", но следи за расходом бесплатных минут
    - cron: "*/15 * * * *"
  workflow_dispatch:        # кнопка "Run workflow" для запуска вручную

concurrency:
  group: repost
  cancel-in-progress: false

permissions:
  contents: write           # нужно, чтобы бот мог сохранять state.json обратно в репозиторий

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py

      - name: Сохранить состояние
        run: |
          git config user.name "repost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "состояние не изменилось"
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
