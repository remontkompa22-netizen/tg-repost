# ═══════════════════════════════════════════════════════════════
#  Настройки бота. Здесь меняется всё, ради чего он нужен.
#  Менять можно прямо на сайте GitHub — карандашик в правом углу файла.
# ═══════════════════════════════════════════════════════════════

# Какой канал читаем (имя после t.me/, без собачки)
source_channel: wilder_wins

# Сколько последних постов страницы смотрим за один заход
posts_per_check: 20

# Что делать при самом первом запуске:
#   skip — только запомнить текущие посты, ничего не публиковать (рекомендуется)
#   last — прислать на проверку один последний пост
first_run: skip

# ─── ТВОЯ ССЫЛКА ────────────────────────────────────────────────
# Сюда подставь свою партнёрскую ссылку. Она заменит все чужие
# ссылки в посте и попадёт в шаблон промокода.
my_link: "https://wilder.black/wiEwGMIfSm"

# ─── ШАПКА СО СКРЫТОЙ ССЫЛКОЙ ──────────────────────────────────
# Первая строка поста. Ссылка прячется под этим текстом — адрес не виден,
# кликается вся строка. Оставь пустым, если шапка не нужна.
header_text: "🎰 WILDER — играть"
# Куда ведёт шапка. Пусто = берётся my_link выше.
header_link: ""

# ─── ТВОЙ ПРОМОКОД ДЛЯ НОВИЧКОВ ────────────────────────────────
# Этот блок добавляется в КАЖДЫЙ пост, внизу, перед подписью.
# <code> делает код копируемым одним нажатием.
newbie_promo: "TJKUXMYYSNL"
newbie_bonus: "150"
newbie_block: |
  🆕 Новым игрокам — <b>{bonus} ₽</b> по промокоду: <code>{promo}</code>
  🔗 Регистрация: {link}

# Точечные замены: что на что. Срабатывают раньше общего правила.
link_replacements:
  "https://wilder21.win/bonus": "https://wilder.black/wiEwGMIfSm"
  "https://wilder21.win": "https://wilder.black/wiEwGMIfSm"
  "https://wilder.black": "https://wilder.black/wiEwGMIfSm"

# ─── ЧИСТКА ЧУЖОГО ──────────────────────────────────────────────
# Строки, содержащие эти куски, выбрасываются целиком
# Осторожно: не пиши сюда кусок своего домена, иначе вылетят строки
# с твоей же ссылкой. Строки, где есть my_link, бот и так не трогает.
drop_lines_matching:
  - "подписыва"
  - "подписаться"
  - "наш канал"
  - "wilder_wins"

# Эти @упоминания оставляем (например, своего бота). Остальные вырезаются.
keep_mentions: []

# Лёгкая замена слов, чтобы текст не был дословной копией
word_replacements:
  "БОНУС-КОД": "ПРОМОКОД"
  "Забрать": "Активировать"
  "Сумма": "Размер бонуса"

# ─── ШАБЛОН ДЛЯ ПРОМОКОДОВ ──────────────────────────────────────
# Если в посте найден промокод, пост собирается заново по этому шаблону.
# Так текст получается полностью твой, а не переписанная копия.
# Доступные подстановки: {promo} {min} {max} {count} {link}
use_promo_template: true
promo_code_regex: "\\b([A-Z]{8,14})\\b"
promo_template: |
  🎁 Свежий промокод: <code>{promo}</code>

  💰 Бонус: от {min} до {max} ₽
  🎫 Активаций: {count}

  Успевай активировать — коды разлетаются быстро.
  👉 {link}

# ─── ПОДПИСЬ ────────────────────────────────────────────────────
# Добавляется в конец каждого поста. Оставь пустым, если не нужна.
signature: "📢 Больше кодов — в нашем канале"

# ─── ЧТО ВООБЩЕ БРАТЬ ───────────────────────────────────────────
# true  — в работу идут только посты с промокодом. Объявления о смене
#         домена, задержках выплат и прочая текучка игнорируются молча.
# false — обрабатываются все посты подряд.
only_promo_posts: true

# ─── МЕДИА ──────────────────────────────────────────────────────
# Переносить картинки и видео из оригинального поста.
# Картинка с промокодом уходит вместе с текстом, текст становится подписью.
keep_media: true

# Показывать под постом превью сайта по ссылке.
# false — пост выглядит аккуратнее и не палит адрес из шапки.
link_preview: false

# ─── АВТОПУБЛИКАЦИЯ ─────────────────────────────────────────────
# Стартовый режим. Дальше переключается кнопками прямо в телеграме:
#   «⚡ Дальше автоматом» на черновике — включить
#   «⏸ Вернуть подтверждение» в уведомлении — выключить
# Выбранный кнопкой режим хранится в state.json и важнее этой строки.
auto_publish: false

# ─── ДОПОЛНИТЕЛЬНЫЕ КАНАЛЫ ──────────────────────────────────────
# Основной канал задаётся секретом CHANNEL_ID. Сюда добавляй остальные —
# пост уходит во все сразу. Бот должен быть админом в каждом
# с правом «Публикация сообщений».
extra_channels:
  - "@mishka_azart"
