# ═══════════════════════════════════════════════════════════════
#  Настройки бота. Здесь меняется всё, ради чего он нужен.
#  Менять можно прямо на сайте GitHub — карандашик в правом углу файла.
# ═══════════════════════════════════════════════════════════════

# ─── ИСТОЧНИКИ ──────────────────────────────────────────────────
# Каналы, за которыми следим. Каждый берёт общие настройки снизу
# и переопределяет свои: ссылку, шапку, промокод новичков, формат кодов.
# Чтобы добавить третий проект — скопируй блок и поправь значения.
sources:

  - name: wilder
    channel: wilder_wins                      # имя после t.me/, без собачки
    my_link: "https://wilder.black/wiEwGMIfSm"
    header_text: "🎰 WILDER — играть"
    newbie_promo: "TJKUXMYYSNL"
    newbie_bonus: "150 ₽"
    promo_code_regex: "\\b([A-Z]{8,14})\\b"     # коды вида ZRRTECFCNB
    link_replacements:
      "https://wilder21.win/bonus": "https://wilder.black/wiEwGMIfSm"
      "https://wilder21.win": "https://wilder.black/wiEwGMIfSm"
      "https://wilder.black": "https://wilder.black/wiEwGMIfSm"
    drop_lines_matching:
      - "подписыва"
      - "подписаться"
      - "наш канал"
      - "wilder_wins"

  - name: cabura
    channel: caburapub2
    my_link: "https://caburka.click/?ref=239049"
    header_text: "🎰 CABURA — играть"
    newbie_promo: "LIVEBET"
    newbie_bonus: "50 FS"
    promo_code_regex: "\\b([A-Z]{3,10}\\d{2,6})\\b"   # коды вида SBER665, DEPS560
    # строки с условиями переносим в пост — без них код у людей не сработает
    condition_patterns:
      - "депозит"
      - "для тех"
      - "\\d+\\s*дн"
      - "пополн"
    link_replacements:
      "https://cabura.cooking": "https://caburka.click/?ref=239049"
      "https://caburka.click": "https://caburka.click/?ref=239049"
    drop_lines_matching:
      - "подписыва"
      - "подписаться"
      - "наш канал"
      - "caburapub"
      - "caburavpn"

# ═══ ОБЩЕЕ ДЛЯ ВСЕХ ИСТОЧНИКОВ ═════════════════════════════════

# ─── КУДА ПУБЛИКУЕМ ─────────────────────────────────────────────
# Основной канал задаётся секретом CHANNEL_ID. Сюда добавляй остальные —
# пост уходит во все сразу. Бот должен быть админом в каждом.
extra_channels:
  - "@mishka_azart"

# Как канал подписан на кнопке черновика.
channel_labels:
  main: "betlive"
  "@mishka_azart": "mishka azart"

# ─── ЧТО БРАТЬ ──────────────────────────────────────────────────
posts_per_check: 20          # сколько последних постов смотрим за заход
first_run: skip              # при первом запуске ничего не шлём, только запоминаем
only_promo_posts: true       # посты без промокода игнорируем
keep_media: true             # картинки и видео переносим
link_preview: false          # превью сайта под постом не показываем
bonus_unit: "₽"              # единица суммы бонуса в посте

# ─── АВТОПУБЛИКАЦИЯ ─────────────────────────────────────────────
# Стартовый режим. Дальше переключается кнопками в телеграме:
#   «⚡ Дальше автоматом» — включить, «⏸ Вернуть подтверждение» — выключить.
# Выбранное кнопкой важнее этой строки.
auto_publish: false

# ─── КАК ВЫГЛЯДИТ ПОСТ ──────────────────────────────────────────
# Подстановки: {promo} {amount} {count} {note} {link}
promo_template: |
  ⚡ <b>СВЕЖИЙ ПРОМОКОД</b> ⚡
  🎟 <code>{promo}</code>

  💸 Бонус: <b>{amount}</b>
  🔥 Осталось активаций: <b>{count}</b>
  ⚠️ {note}

  ⏳ Коды разлетаются за минуты — успевай!
  🚀 {link}

  ━━━━━━━━━━━━━━

# Блок с твоим промокодом — в каждом посте.
newbie_block: |
  🎁 Новичкам <b>{bonus}</b> по коду: <code>{promo}</code>
  💎 Регистрация: {link}

signature: "📢 Больше кодов — в нашем канале"

# Лёгкая замена слов, чтобы текст не был дословной копией
word_replacements:
  "БОНУС-КОД": "ПРОМОКОД"
  "Забрать": "Активировать"
